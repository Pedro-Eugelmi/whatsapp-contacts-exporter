<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Exportar WhatsApp</title>
  <style>
    body { font-family: system-ui, sans-serif; width: 320px; margin: 0; padding: 16px; color: #1f2933; }
    h1 { font-size: 15px; margin: 0 0 12px; }
    label { display: flex; align-items: center; gap: 8px; font-size: 13px; margin-bottom: 8px; }
    select { font-size: 13px; }
    button { width: 100%; padding: 10px; font-size: 14px; border: 0; border-radius: 6px; cursor: pointer; margin-top: 6px; }
    #export { background: #128c7e; color: #fff; font-weight: 600; }
    #diagnose { background: #e4e7eb; color: #1f2933; }
    button:disabled { opacity: 0.6; cursor: wait; }
    #status { font-size: 12px; margin-top: 12px; white-space: pre-wrap; word-break: break-word; max-height: 220px; overflow: auto; }
    .error { color: #b42318; }
  </style>
</head>
<body>
  <h1>Exportar contatos e etiquetas</h1>

  <label>
    Separador do CSV:
    <select id="separator">
      <option value=";">; (Excel em português)</option>
      <option value=",">, (padrão internacional)</option>
    </select>
  </label>

  <button id="export">Exportar CSV</button>
  <button id="diagnose">Diagnóstico</button>

  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
